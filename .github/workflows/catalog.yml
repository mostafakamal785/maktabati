# Rebuilds catalog/catalog.json from novelping browse pages once a week (and on demand from the Actions tab).
name: تحديث الفهرس
on:
  schedule:
    - cron: "0 3 * * 5"   # every Friday 03:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: catalog
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python catalog/build.py
      - name: Commit if it changed
        run: |
          git config user.name "catalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/catalog.json
          git diff --cached --quiet || { git commit -m "تحديث الفهرس الأسبوعي" && git push; }
